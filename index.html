<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jefferson Moreira Evangelista</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#e9edf0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica tema e idioma salvos antes da primeira pintura (sem flash).
      // Mesmas chaves de src/lib/theme.ts, src/lib/motion.ts e src/i18n/index.ts.
      try {
        var t = localStorage.getItem('theme')
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var m = localStorage.getItem('motion')
        var reduce =
          m === 'off' || (m !== 'on' && matchMedia('(prefers-reduced-motion: reduce)').matches)
        if (reduce) document.documentElement.classList.add('reduce-motion')
        var l = localStorage.getItem('lang')
        if (l === 'pt-BR' || l === 'en-US') document.documentElement.lang = l
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
