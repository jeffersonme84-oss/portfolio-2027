<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prévia de efeitos · Home DEFT.</title>
<style>
  :root { --red: #d42a20; --bg: #0d0e09; --fg: #edeae6; }
  body.light { --bg: #f2f4f9; --fg: #161616; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  body.custom-cursor, body.custom-cursor * { cursor: none !important; }

  /* Cena 1376 × 768 escalada, como no site */
  .wrap { position: relative; width: 100vw; aspect-ratio: 1376 / 768; overflow: hidden; perspective: 1400px; }
  .stage { position: absolute; left: 0; top: 0; width: 1376px; height: 768px; transform-origin: 0 0; }
  .tilt { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.16,1,.3,1); }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Brilho vermelho que segue o mouse (efeito "glare") */
  .glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
    background: radial-gradient(260px circle at var(--gx, 50%) var(--gy, 50%), rgb(212 42 32 / .28), transparent 70%);
    mix-blend-mode: screen; }
  body.light .glare { mix-blend-mode: multiply; background: radial-gradient(260px circle at var(--gx,50%) var(--gy,50%), rgb(212 42 32 / .16), transparent 70%); }
  .wrap:hover .glare { opacity: 1; }
  .hot { position: absolute; border-radius: 999px; }
  .photo { position: absolute; left: 560px; top: 110px; width: 360px; height: 600px; }

  /* Cursor personalizado: ponto + halo com inércia */
  .cur-dot, .cur-ring { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; border-radius: 50%; translate: -50% -50%; }
  .cur-dot { width: 8px; height: 8px; background: var(--red); }
  .cur-ring { width: 34px; height: 34px; border: 1.5px solid rgb(212 42 32 / .7);
    display: flex; align-items: center; justify-content: center;
    font: 700 10px/1 ui-monospace, monospace; letter-spacing: .12em; color: #fff;
    transition: width .3s cubic-bezier(.16,1,.3,1), height .3s cubic-bezier(.16,1,.3,1), background .3s, border-color .3s; }
  .cur-ring span { opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .cur-ring.big { width: 84px; height: 84px; background: rgb(212 42 32 / .85); border-color: transparent; }
  .cur-ring.big span { opacity: 1; }
  body:not(.custom-cursor) .cur-dot, body:not(.custom-cursor) .cur-ring { display: none; }

  /* Carregamento: contador 00 → 100% + DEFT. surgindo com blur + cortina */
  .loader { position: fixed; inset: 0; z-index: 60; background: #0d0e09; color: #edeae6; display: grid; place-items: center; }
  .loader .brand { font: 900 clamp(64px, 14vw, 180px)/.9 'Archivo Black', 'Arial Black', system-ui, sans-serif; letter-spacing: -.05em; display: flex; }
  .loader .brand span { opacity: 0; filter: blur(14px); translate: 0 20px; animation: letter .7s cubic-bezier(.16,1,.3,1) forwards; }
  .loader .brand .dot { color: var(--red); }
  .loader .count { position: absolute; right: 40px; bottom: 32px; font: 800 64px/1 'Archivo Black', 'Arial Black', sans-serif; color: var(--red); font-variant-numeric: tabular-nums; }
  .loader .label { position: absolute; left: 40px; bottom: 40px; font: 12px ui-monospace, monospace; letter-spacing: .2em; color: #8a8a8a; }
  .loader .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--red); width: 0; }
  .curtain { position: fixed; inset: 0; z-index: 61; background: var(--red); translate: 0 100%; pointer-events: none; }
  .loader.out { animation: up .8s cubic-bezier(.76,0,.24,1) .25s forwards; }
  .curtain.go { animation: curtain 1.05s cubic-bezier(.76,0,.24,1) forwards; }
  @keyframes letter { to { opacity: 1; filter: none; translate: 0 0; } }
  @keyframes up { to { translate: 0 -100%; } }
  @keyframes curtain { 0% { translate: 0 100%; } 45% { translate: 0 0; } 100% { translate: 0 -100%; } }

  /* Painel da prévia */
  .panel { position: fixed; left: 50%; bottom: 14px; translate: -50% 0; z-index: 40; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    padding: 6px; border-radius: 14px; background: rgb(20 20 20 / .88); backdrop-filter: blur(8px); font: 13px Inter, system-ui, sans-serif; }
  .panel button { cursor: pointer; border: 0; border-radius: 9px; padding: 8px 12px; background: #2a2a2a; color: #eee; font: inherit; }
  .panel button.on { background: var(--red); color: #fff; }
  .note { position: fixed; left: 50%; top: 10px; translate: -50% 0; z-index: 40; padding: 6px 12px; border-radius: 999px; background: rgb(20 20 20 / .88); color: #ddd; font: 12px Inter, system-ui, sans-serif; }
</style>
</head>
<body class="custom-cursor">
  <div class="note">Prévia — passe o mouse na foto, no "Ver projetos" e no "Vamos conversar"</div>

  <div class="wrap" id="wrap">
    <div class="stage" id="stage">
      <div class="tilt" id="tilt">
        <img class="art" id="art" src="/images/hero/home-deft.jpg" alt="" />
        <div class="glare" id="glare"></div>
        <a class="hot" href="#" data-cursor="VER ↓" style="left:28px;top:654px;width:142px;height:44px"></a>
        <a class="hot" href="#" data-cursor="CHAT ↗" style="left:1191px;top:7px;width:150px;height:40px"></a>
        <div class="photo" data-cursor="PLAY ▶"></div>
      </div>
    </div>
  </div>

  <div class="cur-dot" id="dot"></div>
  <div class="cur-ring" id="ring"><span id="ringText"></span></div>

  <div class="loader" id="loader">
    <div class="brand" id="brand"></div>
    <div class="label">CARREGANDO PORTFÓLIO</div>
    <div class="count" id="count">00%</div>
    <div class="bar" id="bar"></div>
  </div>
  <div class="curtain" id="curtain"></div>

  <div class="panel">
    <button id="bLoader">▶ Rever carregamento</button>
    <button id="bCursor" class="on">Cursor</button>
    <button id="bGlare" class="on">Brilho + 3D</button>
    <button id="bTheme">Tema claro</button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), wrap = $('wrap'), tilt = $('tilt'), glare = $('glare');
  const fit = () => stage.style.transform = `scale(${wrap.clientWidth / 1376})`;
  addEventListener('resize', fit); fit();

  // ---------- Carregamento ----------
  function playLoader() {
    const loader = $('loader'), brand = $('brand'), count = $('count'), bar = $('bar'), curtain = $('curtain');
    loader.className = 'loader'; loader.style.translate = ''; curtain.className = 'curtain';
    brand.innerHTML = [...'DEFT'].map((c, i) => `<span style="animation-delay:${0.15 + i * 0.09}s">${c}</span>`).join('') +
      `<span class="dot" style="animation-delay:.55s">.</span>`;
    const start = performance.now(), dur = 1600;
    const tick = (now) => {
      const p = Math.min(1, (now - start) / dur);
      const v = Math.round(100 * (1 - Math.pow(1 - p, 3)));
      count.textContent = String(v).padStart(2, '0') + '%';
      bar.style.width = v + '%';
      if (p < 1) requestAnimationFrame(tick);
      else { curtain.classList.add('go'); loader.classList.add('out'); }
    };
    requestAnimationFrame(tick);
  }
  $('bLoader').onclick = playLoader;
  playLoader();

  // ---------- Cursor com inércia ----------
  const dot = $('dot'), ring = $('ring'), ringText = $('ringText');
  const m = { x: innerWidth / 2, y: innerHeight / 2 }, r = { ...m };
  addEventListener('pointermove', (e) => {
    m.x = e.clientX; m.y = e.clientY;
    dot.style.left = m.x + 'px'; dot.style.top = m.y + 'px';
    const t = e.target.closest('[data-cursor]');
    ring.classList.toggle('big', !!t); ringText.textContent = t ? t.dataset.cursor : '';
  });
  (function loop() {
    r.x += (m.x - r.x) * 0.16; r.y += (m.y - r.y) * 0.16;
    ring.style.left = r.x + 'px'; ring.style.top = r.y + 'px';
    requestAnimationFrame(loop);
  })();
  $('bCursor').onclick = (e) => { document.body.classList.toggle('custom-cursor'); e.currentTarget.classList.toggle('on'); };

  // ---------- Brilho + inclinação 2.5D ----------
  let glareOn = true;
  wrap.addEventListener('pointermove', (e) => {
    if (!glareOn) return;
    const b = wrap.getBoundingClientRect();
    const x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height;
    glare.style.setProperty('--gx', x * 100 + '%'); glare.style.setProperty('--gy', y * 100 + '%');
    tilt.style.transform = `rotateY(${(x - 0.5) * 3}deg) rotateX(${(0.5 - y) * 2.4}deg) scale(1.01)`;
  });
  wrap.addEventListener('pointerleave', () => { tilt.style.transform = ''; });
  $('bGlare').onclick = (e) => { glareOn = !glareOn; glare.style.display = glareOn ? '' : 'none'; tilt.style.transform = ''; e.currentTarget.classList.toggle('on'); };

  // ---------- Tema ----------
  $('bTheme').onclick = (e) => {
    const light = document.body.classList.toggle('light');
    $('art').src = light ? '/images/hero/home-deft-light.jpg' : '/images/hero/home-deft.jpg';
    e.currentTarget.textContent = light ? 'Tema escuro' : 'Tema claro';
  };
</script>
</body>
</html>
